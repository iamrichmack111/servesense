name: Playwright Screenshots

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install app and Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Configure demo environment
        run: cp .env.example .env

      - name: Start ServeSense
        run: docker compose up --build -d

      - name: Wait for app
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8003/ >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Capture Playwright screenshots
        env:
          SERVESENSE_URL: http://127.0.0.1:8003
          ADMIN_USERNAME: owner
          ADMIN_PASSWORD: ServeSenseDemo123!
        run: python tests/playwright_screenshots.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: servesense-playwright-screenshots
          path: docs/screenshots/playwright/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --no-color
