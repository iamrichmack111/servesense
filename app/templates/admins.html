{% extends 'base.html' %}{% block content %}<h1>🔐 Administrator Users</h1><div class="grid2"><section class="panel"><form method="post" class="formgrid"><label>Username<input name="username" required></label><label>Password<input name="password" type="password" required></label><label>Role<select name="role"><option>admin</option><option>manager</option><option>owner</option></select></label><button>Add user</button></form></section><section class="panel"><table><tr><th>User</th><th>Role</th><th>Status</th><th></th></tr>{% for r in rows %}<tr><td>{{ r.username }}</td><td>{{ r.role }}</td><td>{{ 'Active' if r.active else 'Disabled' }}</td><td>{% if r.username != current_user.id %}<form method="post" action="{{ url_for('admin_toggle',username=r.username) }}"><button class="mini">Toggle</button></form>{% endif %}</td></tr>{% endfor %}</table></section></div>{% endblock %}
