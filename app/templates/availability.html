{% extends 'base.html' %}{% block content %}<h1>📆 Availability & PTO</h1><div class="grid2"><section class="panel"><form method="post" class="formgrid"><label>Employee<select name="staff_id" required>{% for p in people %}<option value="{{ p.id }}">{{ p.name }} · {{ p.role }}</option>{% endfor %}</select></label><label>Date<input type="date" name="shift_date" value="{{ today }}" required></label><label>Meal<select name="meal"><option>Lunch</option><option>Dinner</option><option>Brunch</option><option>Open</option></select></label><label>Status<select name="status"><option value="available">✅ Available</option><option value="preferred">⭐ Preferred</option><option value="unavailable">⛔ Unavailable</option><option value="pto">🏖️ PTO</option></select></label><label>Note<textarea name="note"></textarea></label><button>💾 Save availability</button></form></section><section class="panel"><div class="tablewrap"><table><tr><th>Date</th><th>Employee</th><th>Meal</th><th>Status</th><th></th></tr>{% for r in rows %}<tr><td>{{ r.shift_date }}</td><td>{{ r.name }}</td><td>{{ r.meal }}</td><td>{{ r.status }}</td><td><form method="post" action="{{ url_for('availability_delete',aid=r.id) }}"><button class="mini danger">Delete</button></form></td></tr>{% endfor %}</table></div></section></div>{% endblock %}
