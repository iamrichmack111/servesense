<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ServeSense Login</title><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"></head><body class="login-page"><div class="aurora a1"></div><div class="aurora a2"></div><section class="login-card"><div class="logo">🍽️</div><h1>ServeSense</h1><p>Restaurant intelligence, scheduling, and operations.</p>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}<form method="post"><label>👤 Username<input name="username" required autofocus></label><label>🔒 Password<input name="password" type="password" required></label><button>✨ Sign in</button></form><small>{{ restaurant_name }}</small></section></body></html>
