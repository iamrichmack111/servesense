{% extends 'base.html' %}{% block content %}<h1>🗓️ Schedules</h1><a class="button" href="{{ url_for('schedule_new') }}">➕ New schedule</a><section class="panel"><table><tr><th>Date</th><th>Meal</th><th>Expected sales</th><th>Staff</th><th>Status</th><th></th></tr>{% for r in rows %}<tr><td>{{ r.shift_date }}</td><td>{{ r.meal }}</td><td>${{ '%.0f'|format(r.expected_sales) }}</td><td>{{ r.staff_count }}</td><td>{{ r.status }}</td><td><a href="{{ url_for('schedule_builder',shift_id=r.id) }}">Open</a></td></tr>{% endfor %}</table></section>{% endblock %}
