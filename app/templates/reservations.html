{% extends 'base.html' %}{% block content %}<h1>📖 Reservations</h1><div class="grid2"><section class="panel"><form method="post" class="formgrid"><label>Date<input type="date" name="reservation_date" value="{{ today }}" required></label><label>Meal<select name="meal"><option>Lunch</option><option>Dinner</option><option>Brunch</option></select></label><label>Party name<input name="party_name" required></label><label>Party size<input type="number" min="1" name="party_size" required></label><label>Notes<textarea name="notes"></textarea></label><button>📖 Add reservation</button></form></section><section class="panel"><table><tr><th>Date</th><th>Meal</th><th>Party</th><th>Size</th><th></th></tr>{% for r in rows %}<tr><td>{{ r.reservation_date }}</td><td>{{ r.meal }}</td><td>{{ r.party_name }}</td><td>{{ r.party_size }}</td><td><form method="post" action="{{ url_for('reservation_delete',rid=r.id) }}"><button class="mini danger">Delete</button></form></td></tr>{% endfor %}</table><p><a class="button" href="{{ url_for('csv_export',kind='reservations') }}">⬇️ Export reservations</a></p></section></div>{% endblock %}
