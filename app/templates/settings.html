{% extends 'base.html' %}{% block content %}<h1>⚙️ Restaurant Settings</h1><section class="panel narrow"><form method="post" class="formgrid"><label>Restaurant name<input name="restaurant_name" value="{{ vals.get('restaurant_name','') }}"></label><label>Business hours<input name="business_hours" value="{{ vals.get('business_hours','Mon-Sun 11am-11pm') }}"></label><label>Labor target %<input name="default_labor_target" value="{{ vals.get('default_labor_target','22') }}"></label><label>Weather / event note<textarea name="weather_note">{{ vals.get('weather_note','') }}</textarea></label><button>💾 Save settings</button></form><hr><div class="actions"><a class="button" href="{{ url_for('all_export') }}">📦 Backup everything</a><a class="button" href="{{ url_for('csv_export',kind='staff') }}">👥 Staff CSV</a><a class="button" href="{{ url_for('csv_export',kind='sales') }}">💵 Sales CSV</a><a class="button" href="{{ url_for('csv_export',kind='availability') }}">📆 Availability CSV</a><a class="button" href="{{ url_for('csv_export',kind='schedules') }}">🗓️ Schedules CSV</a></div></section>{% endblock %}
